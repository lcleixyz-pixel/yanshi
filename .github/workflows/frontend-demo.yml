name: Frontend Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Smoke coverage includes the real 3D polariscope detection flow.
      CI_WEBGL_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gem-lab/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix gem-lab

      - name: Build production app
        run: npm run build

      - name: Run domain unit tests
        run: npm run test:unit

      - name: Type-check test sources
        run: npm run test:types --prefix gem-lab

      - name: Test CI completeness checks
        run: node --test .github/scripts/verify-polariscope-shards.test.mjs

      - name: Install Playwright Chromium and Mesa
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0 mesa-utils
        working-directory: gem-lab

      - name: Run smoke tests
        # The real 3D detection flow shares the runner's CPU with Mesa;
        # serialize it like the other WebGL jobs to avoid rendering contention.
        run: |
          xvfb-run --auto-servernum glxinfo -B
          xvfb-run --auto-servernum npm run test:smoke --prefix gem-lab -- --workers=1 --output=test-results/smoke
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/smoke/results.json

      - name: Save built application for browser shards
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: gem-lab/dist/
          if-no-files-found: error
          retention-days: 2

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: gem-lab/test-results/smoke/
          retention-days: 14

  polariscope:
    name: Polariscope shard ${{ matrix.shard }}/3
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: gem-lab
    env:
      CI_WEBGL_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/polariscope-${{ matrix.shard }}/results.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gem-lab/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Restore the same production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: gem-lab/dist/

      - name: Install Playwright Chromium and Mesa
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0 mesa-utils

      - name: Run polariscope browser regression shard
        # Keep real GLB loading and the fixture's llvmpipe renderer assertion.
        # This prefix includes the polariscope sim screens (structure, scene, lessons, course, entry, timing) and 3D detection specifications.
        run: |
          xvfb-run --auto-servernum glxinfo -B
          xvfb-run --auto-servernum npx playwright test sim-polariscope \
            --shard=${{ matrix.shard }}/3 --workers=1 --max-failures=3 \
            --output=test-results/polariscope-${{ matrix.shard }}

      - name: Save shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polariscope-shard-${{ matrix.shard }}
          path: gem-lab/test-results/polariscope-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  instruments:
    name: Other instrument browser regression
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gem-lab
    env:
      CI_WEBGL_BACKEND: mesa
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/instruments/results.json
      DEBUG: pw:browser

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gem-lab/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Restore the same production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: gem-lab/dist/

      - name: Install Playwright Chromium and Mesa
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0 mesa-utils

      - name: Run instrument browser regression
        run: |
          xvfb-run --auto-servernum glxinfo -B
          xvfb-run --auto-servernum npx playwright test tests/optics3d.spec.ts tests/microscope3d.spec.ts tests/refractometer3d-course.spec.ts tests/spectroscope-grating.spec.ts tests/spectroscope-library.spec.ts tests/instrument-ui.spec.ts tests/sim-shell.spec.ts tests/sim-refractometer.spec.ts tests/sim-spectroscope-learn.spec.ts tests/sim-spectroscope-lab.spec.ts tests/sim-spectroscope-challenge.spec.ts tests/sim-spectroscope-workbench.spec.ts tests/sim-spectroscope-acceptance.spec.ts \
            --workers=1 --max-failures=1 --output=test-results/instruments
          test -s test-results/instruments/results.json

      - name: Capture browser process state
        if: always()
        run: |
          mkdir -p test-results/instrument-diagnostics
          date -u > test-results/instrument-diagnostics/processes.txt
          ps -eo pid,ppid,stat,pcpu,rss,time,comm | awk 'NR == 1 || $7 ~ /^(node|chrome|chromium|Xvfb)/' >> test-results/instrument-diagnostics/processes.txt
          cat test-results/instrument-diagnostics/processes.txt

      - name: Save instrument browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-browser-evidence
          path: |
            gem-lab/test-results/instruments/
            gem-lab/test-results/instrument-diagnostics/
          if-no-files-found: error
          retention-days: 14

  polariscope-complete:
    name: Verify all 64 polariscope cases
    needs: [build-and-smoke, polariscope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHARDS_RESULT: ${{ needs.polariscope.result }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gem-lab/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix gem-lab

      - name: Download every shard report
        uses: actions/download-artifact@v4
        with:
          pattern: polariscope-shard-*
          path: gem-lab/shard-evidence
          merge-multiple: false

      - name: Collect the complete expected case list
        working-directory: gem-lab
        run: npx playwright test sim-polariscope --list --reporter=json > expected-polariscope.json

      - name: Verify complete passing results
        run: |
          node .github/scripts/verify-polariscope-shards.mjs \
            --expected gem-lab/expected-polariscope.json \
            --reports-dir gem-lab/shard-evidence \
            --output gem-lab/shard-completeness.json

      - name: Save completeness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polariscope-completeness
          path: |
            gem-lab/expected-polariscope.json
            gem-lab/shard-completeness.json
          retention-days: 14
