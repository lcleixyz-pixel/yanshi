name: Frontend Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gem-lab/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix gem-lab

      - name: Build production app
        run: npm run build

      - name: Run domain unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: gem-lab

      - name: Run smoke tests
        run: npm run test:smoke --prefix gem-lab

      - name: Run polariscope browser regression tests
        # This prefix also includes guided-course and student-mode specifications.
        run: npx playwright test polariscope3d --workers=1 --max-failures=3
        working-directory: gem-lab

      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: gem-lab/test-results/
          retention-days: 14
